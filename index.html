<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fb" />
    <title>Checkout | Bayar</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://www.paypal.com" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="checkout-shell">
      <section class="brand" aria-label="Store brand">
        <span class="brand__mark">BA</span>
        <span>Bayar</span>
      </section>

      <section class="checkout-card">
        <div class="checkout-card__intro">
          <p class="eyebrow">PayPal SDK Checkout</p>
          <h1>Complete your payment</h1>
          <p>Enter customer details, then pay with the official PayPal buttons.</p>
        </div>

        <form id="checkout-form" novalidate>
          <div class="field">
            <label for="customer-email">Customer email</label>
            <input
              id="customer-email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="name@example.com"
              required
            />
            <p class="field-error" id="customer-email-error" role="alert"></p>
          </div>

          <div class="field">
            <label for="invoice-item">Description</label>
            <input
              id="invoice-item"
              name="item"
              type="text"
              value="Invoice payment"
              required
              minlength="3"
              maxlength="120"
            />
            <p class="field-error" id="invoice-item-error" role="alert"></p>
          </div>

          <div class="field">
            <label for="invoice-amount">Amount (USD)</label>
            <input
              id="invoice-amount"
              name="amount"
              type="number"
              inputmode="decimal"
              min="0.01"
              step="0.01"
              value="50.84"
              required
            />
            <p class="field-error" id="invoice-amount-error" role="alert"></p>
          </div>

          <button class="primary-button" id="show-paypal" type="submit">
            Continue to PayPal
          </button>
        </form>

        <section id="paypal-section" hidden>
          <div class="order-summary" aria-label="Order summary">
            <div>
              <p class="order-summary__label">Customer</p>
              <p class="order-summary__value" id="summary-email"></p>
              <p class="order-summary__label" style="margin-top: 12px">Description</p>
              <p class="order-summary__value" id="summary-item"></p>
            </div>
            <div>
              <p class="order-summary__label">Total</p>
              <p class="order-summary__total" id="summary-total"></p>
            </div>
          </div>

          <div id="paypal-button-container"></div>
          <p class="payment-message" id="payment-message" role="status"></p>

          <button class="secondary-button" id="edit-checkout" type="button">Edit details</button>
        </section>

        <div class="security-note">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M7 10V8a5 5 0 0 1 10 0v2m-9 0h8a2 2 0 0 1 2 2v7H6v-7a2 2 0 0 1 2-2Z"
            />
          </svg>
          <span>Login and payment details are handled by PayPal.</span>
        </div>
      </section>
    </main>

    <script
      src="https://www.paypal.com/sdk/js?client-id=AcoSQ-EMf7YxRYtdNt1LFCvYyOe8ZDGvi7Jj7mzhEwq_uibxnztuzMVNWcAQpEuO2UBmrVVyFwbEi2a-&merchant-id=L6QMR5J7SMTLN&components=buttons,applepay&enable-funding=applepay,venmo,card,credit,paylater,bancontact,blik,eps,giropay,ideal,mercadopago,mybank,p24,sepa,sofort&currency=USD&locale=en_US"
    ></script>
    <script src="app.js"></script>
  </body>
</html>
