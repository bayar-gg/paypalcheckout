<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout | Bayar</title>
    <link rel="preconnect" href="https://www.paypal.com" />
    <style>
      :root {
        color-scheme: light;
        font-family: Georgia, "Times New Roman", serif;
        color: #17243d;
        --accent: #0b3d2e;
        --muted: #5b6b7c;
        --line: #d7e0ea;
        --bg: #eef3f7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at top right, rgb(11 61 46 / 12%), transparent 28rem),
          linear-gradient(180deg, #f7fafc 0%, var(--bg) 100%);
      }

      main {
        width: min(100% - 32px, 560px);
        margin: 0 auto;
        padding: 40px 0 64px;
      }

      .brand {
        margin-bottom: 28px;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.03em;
      }

      .card {
        padding: 28px;
        border: 1px solid rgb(23 36 61 / 8%);
        border-radius: 20px;
        background: rgb(255 255 255 / 92%);
        box-shadow: 0 18px 50px rgb(23 36 61 / 8%);
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--accent);
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(30px, 7vw, 40px);
        line-height: 1.1;
      }

      .lead,
      .note,
      .msg {
        color: var(--muted);
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 14px;
        line-height: 1.55;
      }

      .lead {
        margin: 0 0 24px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 13px;
        font-weight: 700;
      }

      .field {
        margin-bottom: 14px;
      }

      .field-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      input,
      .paypal-input {
        width: 100%;
        height: 50px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 12px;
        color: #0f172a;
        background: #fff;
        font: inherit;
        outline: none;
      }

      input:focus,
      .paypal-input:focus-within {
        border-color: var(--accent);
        box-shadow: 0 0 0 4px rgb(11 61 46 / 12%);
      }

      input[aria-invalid="true"] {
        border-color: #dc2626;
      }

      .paypal-input {
        overflow: hidden;
      }

      .error {
        min-height: 18px;
        margin: 6px 0 0;
        color: #b91c1c;
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 12px;
      }

      .summary {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 16px;
        margin-bottom: 20px;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #f8fafc;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }

      .summary p {
        margin: 0;
      }

      .summary .label {
        margin-bottom: 4px;
        color: var(--muted);
        font-size: 12px;
      }

      .summary .value {
        font-weight: 700;
        overflow-wrap: anywhere;
      }

      .summary .total {
        font-size: 28px;
        font-weight: 800;
        text-align: right;
      }

      .card-box {
        margin-bottom: 16px;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #fff;
      }

      .card-box h2 {
        margin: 0 0 14px;
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 16px;
      }

      .btn,
      .link-btn {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        min-height: 50px;
        border-radius: 999px;
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-weight: 700;
        cursor: pointer;
      }

      .btn {
        border: 0;
        color: #fff;
        background: #111;
      }

      .btn:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      .link-btn {
        margin-top: 12px;
        border: 1px solid var(--line);
        color: #17243d;
        background: #fff;
      }

      #applepay-button-container {
        margin-bottom: 12px;
      }

      .msg {
        min-height: 20px;
        margin: 12px 0 0;
        color: #166534;
        text-align: center;
      }

      .note {
        margin: 18px 0 0;
        text-align: center;
      }

      .loading-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: rgb(15 23 42 / 45%);
        backdrop-filter: blur(2px);
      }

      .loading-overlay[hidden] {
        display: none;
      }

      .loading-panel {
        display: grid;
        gap: 14px;
        justify-items: center;
        width: min(100% - 48px, 280px);
        padding: 24px 20px;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 18px 50px rgb(15 23 42 / 25%);
        font-family: ui-sans-serif, system-ui, sans-serif;
        text-align: center;
      }

      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid #e2e8f0;
        border-top-color: #111;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      .loading-panel p {
        margin: 0;
        color: #334155;
        font-size: 14px;
        font-weight: 600;
      }

      #fallback-button-container {
        position: relative;
        min-height: 48px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 520px) {
        .summary,
        .field-row {
          grid-template-columns: 1fr;
        }

        .summary .total {
          text-align: left;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">Bayar</div>

      <section class="card">
        <p class="eyebrow">PayPal card checkout</p>
        <h1>Complete your payment</h1>
        <p class="lead">
          Card number, expiry, and CSC appear directly on this page — no Debit or Credit Card
          button to press first.
        </p>

        <form id="checkout-form" novalidate>
          <div class="field">
            <label for="email">Customer email</label>
            <input id="email" type="email" autocomplete="email" placeholder="name@example.com" required />
            <p class="error" id="email-error"></p>
          </div>

          <div class="field">
            <label for="item">Description</label>
            <input id="item" type="text" value="Invoice payment" required minlength="3" maxlength="120" />
            <p class="error" id="item-error"></p>
          </div>

          <div class="field">
            <label for="amount">Amount (USD)</label>
            <input id="amount" type="number" inputmode="decimal" min="0.01" step="0.01" value="50.84" required />
            <p class="error" id="amount-error"></p>
          </div>

          <button class="btn" type="submit">Continue</button>
        </form>

        <section id="pay-section" hidden>
          <div class="summary">
            <div>
              <p class="label">Customer</p>
              <p class="value" id="summary-email"></p>
              <p class="label" style="margin-top: 10px">Description</p>
              <p class="value" id="summary-item"></p>
            </div>
            <div>
              <p class="label">Total</p>
              <p class="total" id="summary-total"></p>
            </div>
          </div>

          <div id="applepay-button-container"></div>

          <div class="card-box" id="card-fields-box">
            <h2>Card information</h2>

            <div class="field">
              <label>Card number</label>
              <div class="paypal-input" id="card-number"></div>
            </div>

            <div class="field-row">
              <div class="field">
                <label>Expires</label>
                <div class="paypal-input" id="card-expiry"></div>
              </div>
              <div class="field">
                <label>CSC</label>
                <div class="paypal-input" id="card-cvv"></div>
              </div>
            </div>

            <div class="field">
              <label>Name on card</label>
              <div class="paypal-input" id="card-name"></div>
            </div>

            <button class="btn" id="pay-card" type="button">Pay now</button>
          </div>

          <div id="fallback-button-container" hidden></div>
          <p class="msg" id="message"></p>
          <button class="link-btn" id="edit" type="button">Edit details</button>
        </section>

        <p class="note">Card inputs are PayPal hosted fields (PCI-safe).</p>
      </section>
    </main>

    <div class="loading-overlay" id="loading-overlay" hidden>
      <div class="loading-panel" role="status" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <p id="loading-text">Loading card form…</p>
      </div>
    </div>

    <script src="https://www.paypal.com/sdk/js?client-id=AcoSQ-EMf7YxRYtdNt1LFCvYyOe8ZDGvi7Jj7mzhEwq_uibxnztuzMVNWcAQpEuO2UBmrVVyFwbEi2a-&merchant-id=L6QMR5J7SMTLN&components=card-fields,buttons,applepay&enable-funding=applepay,card&currency=USD&intent=capture&locale=en_US"></script>
    <script>
      const MERCHANT_ID = "L6QMR5J7SMTLN";

      const form = document.querySelector("#checkout-form");
      const paySection = document.querySelector("#pay-section");
      const email = document.querySelector("#email");
      const item = document.querySelector("#item");
      const amount = document.querySelector("#amount");
      const emailError = document.querySelector("#email-error");
      const itemError = document.querySelector("#item-error");
      const amountError = document.querySelector("#amount-error");
      const summaryEmail = document.querySelector("#summary-email");
      const summaryItem = document.querySelector("#summary-item");
      const summaryTotal = document.querySelector("#summary-total");
      const message = document.querySelector("#message");
      const edit = document.querySelector("#edit");
      const payCard = document.querySelector("#pay-card");
      const cardFieldsBox = document.querySelector("#card-fields-box");
      const fallbackBox = document.querySelector("#fallback-button-container");
      const loadingOverlay = document.querySelector("#loading-overlay");
      const loadingText = document.querySelector("#loading-text");
      const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      let checkout = null;
      let cardField = null;
      let appleButton = null;
      let fallbackButton = null;
      let formWatcher = null;
      let loadingTimer = null;

      function setLoading(on, text) {
        if (text) loadingText.textContent = text;
        loadingOverlay.hidden = !on;
        if (!on && loadingTimer) {
          window.clearTimeout(loadingTimer);
          loadingTimer = null;
        }
      }

      function stopFormWatcher() {
        if (formWatcher) {
          formWatcher.disconnect();
          formWatcher = null;
        }
      }

      function watchCardFormOpen() {
        stopFormWatcher();
        const startHeight = fallbackBox.offsetHeight;

        formWatcher = new MutationObserver(() => {
          // Card form expands the PayPal button iframe/container when ready.
          if (fallbackBox.offsetHeight > startHeight + 80) {
            setLoading(false);
            stopFormWatcher();
          }
        });

        formWatcher.observe(fallbackBox, {
          childList: true,
          subtree: true,
          attributes: true,
          attributeFilter: ["style", "class", "height"],
        });

        // Safety timeout so loading never sticks forever.
        loadingTimer = window.setTimeout(() => {
          setLoading(false);
          stopFormWatcher();
        }, 12000);
      }

      function money(value) {
        return new Intl.NumberFormat("en-US", {
          style: "currency",
          currency: "USD",
          minimumFractionDigits: 2,
        }).format(Number(value));
      }

      function setError(input, node, text) {
        node.textContent = text || "";
        if (text) input.setAttribute("aria-invalid", "true");
        else input.removeAttribute("aria-invalid");
      }

      function validate() {
        const amountValue = Number(amount.value);
        setError(email, emailError, emailOk.test(email.value.trim()) ? "" : "Enter a valid email.");
        setError(item, itemError, item.value.trim().length >= 3 ? "" : "Description is required.");
        setError(
          amount,
          amountError,
          Number.isFinite(amountValue) && amountValue >= 0.01 ? "" : "Enter amount >= 0.01.",
        );
        return (
          emailOk.test(email.value.trim()) &&
          item.value.trim().length >= 3 &&
          Number.isFinite(amountValue) &&
          amountValue >= 0.01
        );
      }

      function orderPayload() {
        return {
          intent: "CAPTURE",
          purchase_units: [
            {
              description: checkout.item,
              custom_id: checkout.email,
              amount: {
                currency_code: "USD",
                value: checkout.amount,
              },
              payee: { merchant_id: MERCHANT_ID },
            },
          ],
          application_context: {
            shipping_preference: "NO_SHIPPING",
            user_action: "PAY_NOW",
          },
        };
      }

      // Browser-side order create via Smart Buttons SDK helpers (no Client Secret).
      function createOrderId() {
        return new Promise((resolve, reject) => {
          const host = document.createElement("div");
          host.hidden = true;
          document.body.appendChild(host);

          let settled = false;
          const finish = (fn, value) => {
            if (settled) return;
            settled = true;
            try {
              buttons.close && buttons.close();
            } catch (_) {}
            host.remove();
            fn(value);
          };

          const buttons = window.paypal.Buttons({
            createOrder(_data, actions) {
              return actions.order
                .create(orderPayload())
                .then((id) => {
                  finish(resolve, id);
                  return id;
                })
                .catch((err) => finish(reject, err));
            },
            onError(err) {
              finish(reject, err);
            },
          });

          buttons
            .render(host)
            .then(() => {
              if (typeof buttons.createOrder === "function") {
                return buttons.createOrder({ paymentSource: "card" });
              }
              throw new Error(
                "Enable Advanced Card Payments in PayPal Developer Dashboard for embedded card fields.",
              );
            })
            .then((id) => {
              if (id) finish(resolve, id);
            })
            .catch((err) => finish(reject, err));
        });
      }

      function destroyWidgets() {
        cardField = null;
        if (appleButton?.close) appleButton.close();
        if (fallbackButton?.close) fallbackButton.close();
        appleButton = null;
        fallbackButton = null;
        document.querySelector("#applepay-button-container").innerHTML = "";
        ["#card-number", "#card-expiry", "#card-cvv", "#card-name"].forEach((sel) => {
          document.querySelector(sel).innerHTML = "";
        });
        fallbackBox.innerHTML = "";
        fallbackBox.hidden = true;
        cardFieldsBox.hidden = false;
      }

      function renderApplePay() {
        if (!window.paypal?.Buttons || !window.paypal.FUNDING?.APPLEPAY) return;
        appleButton = window.paypal.Buttons({
          fundingSource: window.paypal.FUNDING.APPLEPAY,
          style: { layout: "vertical", color: "black", shape: "rect", height: 48, tagline: false },
          createOrder(_d, actions) {
            return actions.order.create(orderPayload());
          },
          async onApprove(_d, actions) {
            message.textContent = "Processing Apple Pay…";
            try {
              const order = await actions.order.capture();
              message.textContent = `Payment completed. Transaction ID: ${order.id}`;
            } catch {
              message.textContent = "Apple Pay payment could not be completed.";
            }
          },
        });
        if (!appleButton.isEligible || appleButton.isEligible()) {
          appleButton.render("#applepay-button-container");
        }
      }

      function showFallbackCardButton(reason) {
        cardFieldsBox.hidden = true;
        fallbackBox.hidden = false;
        message.textContent = reason;
        fallbackButton = window.paypal.Buttons({
          fundingSource: window.paypal.FUNDING.CARD,
          style: {
            layout: "vertical",
            color: "black",
            shape: "rect",
            height: 48,
            tagline: false,
            label: "pay",
          },
          onClick() {
            setLoading(true, "Loading card form…");
            watchCardFormOpen();
            return true;
          },
          createOrder(_d, actions) {
            setLoading(true, "Preparing payment…");
            return actions.order.create(orderPayload());
          },
          async onApprove(_d, actions) {
            setLoading(true, "Processing payment…");
            try {
              const order = await actions.order.capture();
              setLoading(false);
              message.textContent = `Payment completed. Transaction ID: ${order.id}`;
            } catch {
              setLoading(false);
              message.textContent = "Payment could not be completed.";
            }
          },
          onCancel() {
            setLoading(false);
            stopFormWatcher();
            message.textContent = "Payment cancelled.";
          },
          onError() {
            setLoading(false);
            stopFormWatcher();
            message.textContent = "PayPal reported an error. Please try again.";
          },
        });
        fallbackButton.render("#fallback-button-container");
      }

      function renderCardFields() {
        if (!window.paypal?.CardFields) {
          showFallbackCardButton("Card Fields are unavailable. Showing PayPal card button instead.");
          return;
        }

        cardField = window.paypal.CardFields({
          style: {
            input: {
              "font-size": "16px",
              "font-family": "ui-sans-serif, system-ui, sans-serif",
              color: "#0f172a",
            },
            ".invalid": { color: "#b91c1c" },
          },
          createOrder(data, actions) {
            // Newer SDKs may provide actions; otherwise use browser order helper.
            if (actions?.order?.create) {
              return actions.order.create(orderPayload());
            }
            return createOrderId();
          },
          onApprove(data, actions) {
            message.textContent = "Processing payment…";
            const finish = (id) => {
              message.textContent = `Payment completed. Transaction ID: ${id}`;
            };
            if (actions?.order?.capture) {
              return actions.order
                .capture()
                .then((order) => finish(order.id))
                .catch(() => finish(data.orderID));
            }
            finish(data.orderID);
          },
          onError(err) {
            console.error(err);
            message.textContent = "Card payment failed. Check the details and try again.";
          },
        });

        if (!cardField.isEligible()) {
          showFallbackCardButton(
            "Embedded card form is not enabled on this PayPal app. Enable Advanced Card Payments in PayPal Developer Dashboard, then refresh.",
          );
          return;
        }

        cardField.NumberField({ placeholder: "Card number" }).render("#card-number");
        cardField.ExpiryField({ placeholder: "MM/YY" }).render("#card-expiry");
        cardField.CVVField({ placeholder: "CSC" }).render("#card-cvv");
        cardField.NameField({ placeholder: "Name on card" }).render("#card-name");
        message.textContent = "";
      }

      payCard.addEventListener("click", async () => {
        if (!cardField) return;
        payCard.disabled = true;
        setLoading(true, "Submitting card…");
        try {
          await cardField.submit();
        } catch (error) {
          console.error(error);
          message.textContent = error?.message || "Unable to submit card details.";
        } finally {
          setLoading(false);
          payCard.disabled = false;
        }
      });

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        if (!validate()) return;
        if (!window.paypal) {
          message.textContent = "PayPal SDK failed to load.";
          return;
        }

        checkout = {
          email: email.value.trim(),
          item: item.value.trim(),
          amount: Number(amount.value).toFixed(2),
        };

        form.hidden = true;
        paySection.hidden = false;
        summaryEmail.textContent = checkout.email;
        summaryItem.textContent = checkout.item;
        summaryTotal.textContent = money(checkout.amount);
        destroyWidgets();
        setLoading(true, "Loading payment options…");
        renderApplePay();
        renderCardFields();
        window.setTimeout(() => setLoading(false), 700);
      });

      edit.addEventListener("click", () => {
        if (checkout) {
          email.value = checkout.email;
          item.value = checkout.item;
          amount.value = checkout.amount;
        }
        setLoading(false);
        stopFormWatcher();
        destroyWidgets();
        paySection.hidden = true;
        form.hidden = false;
        message.textContent = "";
      });
    </script>
  </body>
</html>
